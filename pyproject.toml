[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ipc-scanner"
version = "1.0.0"
description = "IPC/NVR 扫描管理工具"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "scapy>=2.5.0",
    "python-nmap>=0.7.1",
    "onvif-zeep>=0.2.12",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "openpyxl>=3.1.0",
    "opencv-python>=4.8.0",
]

[project.scripts]
ipc-scanner = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
