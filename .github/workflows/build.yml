name: Build & Release

on:
  push:
    tags:
      - 'v*'  # 推送 tag (v1.0.0) 时触发
  workflow_dispatch:  # 手动触发
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: false
        default: 'dev'

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nmap
        run: choco install nmap -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: python build.py --onefile --package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPCScanner-windows
          path: release/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libgl1 libegl1 nmap

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: python build.py --onefile --package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPCScanner-linux
          path: release/IPCScanner-*-linux-*

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/IPCScanner-*
          name: IPC Scanner v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
